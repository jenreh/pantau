profile: default

app:
  name: pantau
  version: 0.1.0
  logging: logging.yaml
  environment: development

  wake_word:
    model: models/pantau.tflite
    threshold: 0.5
    post_wake_timeout_s: 6.0

  stt:
    model_size: small
    device: auto
    language: de

  tts:
    model: models/de_DE-thorsten-high.onnx
    speak_rate: 1.0

  llm:
    provider: openai
    model: gpt-5.4-nano
    api_key: secret:pt-openai-api-key
    base_url: https://api.openai.com/v1

  mcp:
    servers:
      - name: harmonyhub
        command: uv
        args:
          - run
          - harmony-mcp
      - name: huehub
        command: uv
        args:
          - run
          - hue-mcp
      # Optional external MCP servers:
      # - name: code-reasoning
      #   command: npx
      #   args:
      #     - -y
      #     - '@mettamatt/code-reasoning'
      # - name: duckduckgo
      #   command: uvx
      #   args:
      #     - duckduckgo-mcp-server
