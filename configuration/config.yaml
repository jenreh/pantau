profile: default

app:
  name: pantau
  version: 0.1.0
  logging: logging.yaml
  environment: development

  wake_word:
    model: models/pantau_x.tflite
    threshold: 0.5
    post_wake_timeout_s: 6.0

  stt:
    model_size: medium
    device: auto
    language: de

  tts:
    model: models/de_DE-thorsten-high.onnx
    speak_rate: 1.0

  llm:
    provider: openai
    model: gpt-5.4-nano
    api_key: secret:pt-openai-api-key
    base_url: https://api.openai.com/v1

  mcp:
    servers:
      - name: harmony
        command: uv
        args:
          - run
          - harmony-mcp
          - --no-banner
      - name: hue
        command: uvx
        args:
          - huehub-py
      - name: homekit
        command: uvx
        args:
          - homekit-py
      - name: sonos
        command: uvx
        arg:
          - sonos-py
      - name: duckduckgo
        command: uvx
        args:
          - duckduckgo-mcp-server
