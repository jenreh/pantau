profile: default

app:
  name: pantau
  version: 0.1.0
  logging: logging.yaml
  environment: development

  wake_word:
    model: models/pantau_x.tflite
    threshold: 0.5
    post_wake_timeout_s: 3.0

  stt:
    provider: simul_streaming
    model_size: large
    device: auto
    language: de
    silence_stop_s: 0.4
    intent_enabled: false
    simul_model_path: models/small.pt

  tts:
    model: models/de_DE-thorsten-high.onnx
    speak_rate: 1.0

  llm:
    provider: openai
    model: gpt-5.4-nano
    api_key: secret:pt-openai-api-key
    base_url: https://api.openai.com/v1

  mcp:
    servers:
      - name: harmony
        command: uv
        args:
          - --quiet
          - run
          - harmony-mcp
          - --no-banner
      - name: hue
        command: uvx
        args:
          - --quiet
          - huehub-py
      - name: homekit
        command: uvx
        args:
          - --quiet
          - homekit-py
        init_timeout: 30
      - name: sonos
        command: uvx
        args:
          - --quiet
          - sonos-py
      - name: duckduckgo
        command: uvx
        args:
          - --quiet
          - duckduckgo-mcp-server
