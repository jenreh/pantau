- input: "schalte den Fernseher ein"
  expected_tool: harmony_start_activity
  expected_args: {activity: Fernsehen}

- input: "mach das Wohnzimmer an"
  expected_tool: hue_set_room_on
  expected_args: {room: Wohnzimmer}

- input: "schalte den Fernseher aus"
  expected_tool: harmony_power_off

- input: "schalte auf ZDF"
  expected_tool: harmony_set_channel
  expected_args: {channel: 2}

- input: "Musik im Wohnzimmer lauter stellen auf 60"
  expected_tool: sonos_set_volume
  expected_args: {value: 60}
